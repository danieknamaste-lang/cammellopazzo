name: APK Agente Opzioni

on:
  push:
    branches: [main, claude/local-chat-app-s8sblp, claude/umbrel-multiagent-interface-30gh9b]
    paths:
      - "options-agent/public/**"
      - "options-agent/lib/schema.js"
      - "options-agent/lib/rules.js"
      - "android-opzioni/**"
      - ".github/workflows/opzioni-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installa Capacitor
        working-directory: android-opzioni
        run: npm install

      - name: Prepara i file web (interfaccia + moduli condivisi)
        working-directory: android-opzioni
        run: npm run build

      - name: Genera il progetto Android
        working-directory: android-opzioni
        run: npx cap add android

      - name: Consenti il traffico in chiaro verso la tailnet
        working-directory: android-opzioni
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Nel manifest generato "<application" è seguito da un a capo, quindi
          # l'attributo va inserito subito dopo il tag, non cercando uno spazio.
          perl -0pi -e 's|<application(?![^>]*usesCleartextTraffic)|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          grep -o 'android:usesCleartextTraffic="[^"]*"' "$MANIFEST"

      - name: Build APK (debug)
        working-directory: android-opzioni
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Rinomina l'APK
        run: cp android-opzioni/android/app/build/outputs/apk/debug/app-debug.apk agente-opzioni-debug.apk

      - name: Carica come artifact
        uses: actions/upload-artifact@v4
        with:
          name: agente-opzioni-apk
          path: agente-opzioni-debug.apk
          retention-days: 30

      - name: Pubblica la release (scaricabile dal telefono)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="opzioni-apk-${{ github.run_number }}"
          gh release create "$TAG" agente-opzioni-debug.apk \
            --title "Agente Opzioni · APK ${{ github.run_number }}" \
            --notes "APK di debug per sideload (GrapheneOS incluso). Endpoint da impostare in ⚙: indirizzo Tailscale del mac, es. http://100.x.y.z:8000. Commit: ${{ github.sha }}"
