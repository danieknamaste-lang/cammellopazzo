name: Agente Opzioni (test + immagine Umbrel)

on:
  push:
    branches: [main, claude/local-chat-app-s8sblp, claude/umbrel-multiagent-interface-30gh9b]
    paths:
      - "options-agent/**"
      - "cammellopazzo-options-agent/**"
      - ".github/workflows/options-agent.yml"
  pull_request:
    paths:
      - "options-agent/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test di fumo
        working-directory: options-agent
        run: node test/smoke.js

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login su GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome immagine in minuscolo
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cammellopazzo-options-agent" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup QEMU (build arm64 per Raspberry Pi)
        uses: docker/setup-qemu-action@v3

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: options-agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
